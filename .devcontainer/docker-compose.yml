version: "3.8"
services:
  dev_base:
    build:
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/chat-demo:cached
  dev_data:
    environment:
      POSTGRES_DB: vpwa_db
      POSTGRES_USER: vpwa_chat
      POSTGRES_PASSWORD: vpwa_developer
    expose:
      - "5432"
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - db-data:/tmp/dev/pgsql/data
volumes:
  db-data:
